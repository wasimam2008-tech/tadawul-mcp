services:
  - type: web
    name: tadawul-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: MCP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
